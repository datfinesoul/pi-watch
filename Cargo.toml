[package]
name = "pi-watch"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSTimer", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSRunningApplication"] }
